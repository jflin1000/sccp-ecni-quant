[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sccp-ecni-quant"
version = "0.1.0"
description = "Auto quantification of SCCPs by unit-resolution GC-ECNI-MS (NNLS deconvolution and Reth Fa–D')"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "sccp-ecni-quant contributors" }]
keywords = ["sccp", "chlorinated-paraffins", "gc-ecni", "mass-spectrometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sccp-ecni = "sccp_ecni.cli:main"

[project.urls]
Homepage = "https://github.com/jflin1000/sccp-ecni-quant"
Repository = "https://github.com/jflin1000/sccp-ecni-quant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
